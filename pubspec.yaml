name: jarvis_app
description: Jarvis - Personal AI Assistant

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.3
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  animated_text_kit: ^4.2.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
